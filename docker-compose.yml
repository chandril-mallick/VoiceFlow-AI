services:
  # ───────────────────────────────────────────────
  # Reverse Proxy
  # ───────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped
    networks:
      - voiceflow

  # ───────────────────────────────────────────────
  # Frontend — Next.js 15
  # ───────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost/api
      - NEXT_PUBLIC_WS_URL=ws://localhost/ws
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    restart: unless-stopped
    networks:
      - voiceflow

  # ───────────────────────────────────────────────
  # Backend — FastAPI
  # ───────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    env_file: .env
    volumes:
      - ./backend/src:/app/src
      - ./uploads:/app/uploads
      - ./recordings:/app/recordings
      - piper_voices:/app/data/piper-voices
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - voiceflow

  # ───────────────────────────────────────────────
  # Celery Worker
  # ───────────────────────────────────────────────
  celery-worker:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    command: celery -A src.workers.celery_app worker --loglevel=info --concurrency=4
    env_file: .env
    volumes:
      - ./backend/src:/app/src
      - ./uploads:/app/uploads
      - ./recordings:/app/recordings
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - voiceflow

  # ───────────────────────────────────────────────
  # Celery Beat (Scheduler)
  # ───────────────────────────────────────────────
  celery-beat:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    command: celery -A src.workers.celery_app beat --loglevel=info
    env_file: .env
    volumes:
      - ./backend/src:/app/src
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - voiceflow

  # ───────────────────────────────────────────────
  # PostgreSQL 16
  # ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voiceflow}
      POSTGRES_USER: ${POSTGRES_USER:-voiceflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voiceflow_secret_2024}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-voiceflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - voiceflow

  # ───────────────────────────────────────────────
  # Redis 7
  # ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - voiceflow

  # ───────────────────────────────────────────────
  # Qdrant Vector Database
  # ───────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    restart: unless-stopped
    networks:
      - voiceflow

  # ───────────────────────────────────────────────
  # Ollama (Local LLM)
  # ───────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    networks:
      - voiceflow
    # Uncomment for GPU support:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  ollama_data:
  piper_voices:

networks:
  voiceflow:
    driver: bridge
